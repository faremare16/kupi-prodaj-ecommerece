<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-dark text-light">
  <div class="card bg-black border border-secondary shadow-lg p-4" style="width: 380px; border-radius: 8px;">
    
    <div class="text-center mb-4">
      <svg height="48" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="48" data-view-component="true" class="octicon octicon-mark-github text-light mb-2">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      <h2 class="h3 fw-normal text-light">Sign up to KupiProdaj</h2>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger py-2 text-center text-sm mb-3" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success py-2 text-center text-sm mb-3" role="alert">
      {{ successMessage }}
    </div>

    <form #form="ngForm" (ngSubmit)="onRegister()">
      
      <div class="mb-3">
        <label for="username" class="form-label text-secondary small fw-bold">Username / Name</label>
        <input 
          type="text" 
          id="username"
          name="username" 
          class="form-control bg-dark text-light border-secondary" 
          [(ngModel)]="registerData.username" 
          #username="ngModel"
          required 
          minlength="3"
          placeholder="Enter your name"
        />
        <div *ngIf="username.invalid && (username.dirty || username.touched)" class="text-danger small mt-1">
          <div *ngIf="username.errors?.['required']">Username is required.</div>
          <div *ngIf="username.errors?.['minlength']">Must be at least 3 characters long.</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label text-secondary small fw-bold">Email address</label>
        <input 
          type="email" 
          id="email"
          name="email" 
          class="form-control bg-dark text-light border-secondary" 
          [(ngModel)]="registerData.email" 
          #email="ngModel"
          required 
          email
          placeholder="name@example.com"
        />
        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger small mt-1">
          <div *ngIf="email.errors?.['required']">Email address is required.</div>
          <div *ngIf="email.errors?.['email']">Please enter a valid email address.</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label text-secondary small fw-bold">Password</label>
        <input 
          type="password" 
          id="password"
          name="password" 
          class="form-control bg-dark text-light border-secondary" 
          [(ngModel)]="registerData.password" 
          #password="ngModel"
          required 
          minlength="6"
          placeholder="••••••••"
        />
        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger small mt-1">
          <div *ngIf="password.errors?.['required']">Password is required.</div>
          <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters long.</div>
        </div>
      </div>

      <button type="submit" class="backend-btn w-100 btn btn-success fw-bold py-2 mt-2" style="background-color: #238636; border-color: #2ea043;" [disabled]="form.invalid">
        Create account
      </button>
    </form>

    <div class="text-center mt-4 p-3 border border-secondary rounded bg-dark text-secondary small">
      Already have an account? <a href="/login" class="text-decoration-none text-info fw-bold">Sign in</a>.
    </div>

  </div>
</div>
