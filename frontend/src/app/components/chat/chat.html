<div class="container-fluid min-vh-100 bg-dark text-light py-5 px-lg-5 px-3">
  
  <!-- Header -->
  <div class="row mb-4 align-items-center">
    <div class="col text-start">
      <div class="d-flex align-items-center gap-3">
        <a routerLink="/product-list" class="btn btn-outline-secondary rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
          ←
        </a>
        <div>
          <h2 class="fw-bold text-white mb-0">Conversation with {{ recipientUsername }}</h2>
          <p class="text-secondary small mb-0">Direct Real-Time Marketplace Chat</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Box Container -->
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card bg-black border border-secondary rounded-4 shadow-lg overflow-hidden">
        
        <!-- Chat Header bar -->
        <div class="p-3 bg-dark bg-opacity-75 border-bottom border-secondary d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <span class="fs-5">💬</span>
            <span class="fw-semibold text-light">@{{ recipientUsername }}</span>
          </div>
          <span class="badge bg-success bg-opacity-25 text-success border border-success px-3 py-1 rounded-pill small">
            ● Active
          </span>
        </div>

        <!-- Chat History Area -->
        <div class="card-body p-4 chat-history-box d-flex flex-column gap-3 overflow-y-auto" style="height: 480px;">
          
          <div *ngIf="messages.length === 0" class="text-center text-secondary my-auto">
            <p class="mb-0">No messages yet. Say hello to <strong>{{ recipientUsername }}</strong>!</p>
          </div>

          <div *ngFor="let msg of messages" 
               class="d-flex flex-column"
               [ngClass]="{
                 'align-items-end': msg.senderUsername !== recipientUsername, 
                 'align-items-start': msg.senderUsername === recipientUsername
               }">
            
            <div class="p-3 rounded-4 max-w-75 shadow-sm"
                 [ngClass]="{
                   'bg-success bg-gradient text-white rounded-bottom-end-0': msg.senderUsername !== recipientUsername,
                   'bg-dark border border-secondary text-light rounded-bottom-start-0': msg.senderUsername === recipientUsername
                 }"
                 style="max-width: 75%;">
              
              <div class="small fw-bold mb-1 opacity-75" style="font-size: 0.75rem;">
                {{ msg.senderUsername }}
              </div>
              
              <div class="text-break">{{ msg.content }}</div>
              
              <div class="text-end small opacity-50 mt-1" style="font-size: 0.65rem;">
                {{ msg.timeStamp | date:'HH:mm' }}
              </div>
            </div>

          </div>

        </div>

        <!-- Input Section -->
        <div class="p-3 bg-dark bg-opacity-50 border-top border-secondary">
          <div class="input-group">
            <input type="text" 
                   class="form-control bg-black border-secondary text-light shadow-none py-2 px-3" 
                   placeholder="Type your message here..."
                   [(ngModel)]="newMessage" 
                   (keyup.enter)="sendMessage()">
            
            <button class="btn btn-success fw-semibold px-4" 
                    type="button"
                    style="background-color: #238636; border-color: #2ea043;"
                    (click)="sendMessage()">
              Send 🚀
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
